<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - PENOKS Neighborhood Friends</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>

<header class="navbar">
  <div class="brand"><img src="/assets/logo.png" alt="PENOKS logo"></div>
  <nav>
    <a href="/index.html">Home</a>
    <a href="/about.html">About</a>
    <a href="/events.html">Events</a>
    <a href="/news.html">News</a>
  </nav>
  <a class="contact-btn" href="/contact.html">Contact</a>
</header>

<div class="login-wrap">
  <h1>Set a New Password</h1>
  <p class="subtle" id="intro">Choose a new password for your member account.</p>
  <div id="errorBox" class="error-msg" style="display:none;"></div>
  <div id="successBox" class="success-msg" style="display:none;"></div>
  <form id="resetForm">
    <label>New Password (at least 8 characters)</label>
    <input type="password" id="newPassword" minlength="8" required autocomplete="new-password">
    <label>Confirm New Password</label>
    <input type="password" id="confirmPassword" minlength="8" required autocomplete="new-password">
    <button class="btn" type="submit" id="resetBtn" style="width:100%;">Update Password</button>
  </form>
  <p class="subtle" id="loginLink" style="display:none; margin-top:16px;">
    <a href="/login.html" style="text-decoration:underline;">Go to Member Login</a>
  </p>
</div>

<footer class="site-footer">
  <div>&copy; <span class="footer-year"></span> PENOKS Neighborhood Friends. All rights reserved.</div>
  <div class="footer-center">Powered by: GewenchiTech</div>
  <div class="footer-right"><a href="/privacy-policy.html">Privacy Policy</a><a href="/club-constitution.html">Club Constitution</a></div>
</footer>

<script src="/js/nav.js"></script>
<script src="/js/footer.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const form = document.getElementById('resetForm');
  const errorBox = document.getElementById('errorBox');
  const successBox = document.getElementById('successBox');
  const resetBtn = document.getElementById('resetBtn');

  if (!token) {
    form.style.display = 'none';
    document.getElementById('intro').style.display = 'none';
    errorBox.textContent = 'This reset link is invalid. Please ask the admin to send you a new one.';
    errorBox.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const newPassword = document.getElementById('newPassword').value;
    if (newPassword !== document.getElementById('confirmPassword').value) {
      errorBox.textContent = 'The two passwords do not match.';
      errorBox.style.display = 'block';
      return;
    }
    resetBtn.disabled = true;
    resetBtn.textContent = 'Updating...';
    try {
      const res = await fetch('/api/password-reset/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword })
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || 'Could not update your password');
      form.style.display = 'none';
      document.getElementById('intro').style.display = 'none';
      successBox.textContent = `Password updated for ${body.memberId}. You can now log in with your new password.`;
      successBox.style.display = 'block';
      document.getElementById('loginLink').style.display = 'block';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      resetBtn.disabled = false;
      resetBtn.textContent = 'Update Password';
    }
  });
</script>
</body>
</html>
